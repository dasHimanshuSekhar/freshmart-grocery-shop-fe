name: Deploy to Firebase Hosting (Staging)

on:
  push:
    branches:
      - staging 

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' 

      - name: Install dependencies
        run: npm install

      # ➡️ FIX: Create the .env.stage file from GitHub Secrets
      # This step writes the content of a secret into the file env-cmd is looking for.
      - name: Create .env.stage from Secret
        run: echo "${{ secrets.STAGING_ENV_FILE_CONTENT }}" > .env.stage
        # The runner will now find this file in the next step.

      - name: Build the app
        run: npm run build:stage # This now executes: env-cmd -f .env.stage next build --no-lint

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: staging